{% extends "base.html" %}
{% block title %}Login{% endblock title %}
{% block content %}
<h1>Welcome</h1>
<div class="d-flex justify-content-center align-items-center vh-80">
    <div class="card bg-light  w-50 h-50 ">
    <div>    
    <h3 class="text-dark">Login</h3>
    {% for message in messages %}
    <div  class="alert alert-{{message.tags}} alert-dismissible fade show" 
    role="alert">
        <strong>{{message}}</strong> .
        <button type="button" class="btn-close" data-bs-dismiss="alert" 
        aria-label="Close"></button>
    </div>
    {% endfor %}
   

<form action="/auth/login/"  method="post"> {% csrf_token %}
    
    <br />
   
    <label for="email" class="form-label">Email:</label>
    <div class="form-group">
      
    <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>
    <label for="pass1" >Password</label>
    <div class="form-group">
      <input type="password" class="form-control p-2" id="pass1" placeholder="Enter password" name="pass1">
    </div>
    
    <br/>
    New User?  <a href="/auth/signup/">Signup</a>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
{% endblock content %}
