{% extends "base.html" %}
{%block title %} Contact Us {%endblock title%}


{% block body %}

<h1>Contact Us </h1>
<div class="container mt-2">
    {% for message in messages %}
    <div  class="alert alert-{{message.tags}} alert-dismissible fade show" 
    role="alert">
        <strong>{{message}}</strong> .
        <button type="button" class="btn-close" data-bs-dismiss="alert" 
        aria-label="Close"></button>
    </div>
    {% endfor %}


<div class="row">
    <div class="col-md-4">3</div>
    <div class="col-lg-4">6
         
    <form action="/contact"  method="POST"> {% csrf_token %}
        
        <br />
       
        <label for="name">Full Name</label>
        <div class="form-group">
          <input type="text" class="form-control p-2" id="email" name="email" value="{{user.email}}" required >
        </div>
        <label for="pass1" > how can i help you</label>
        <div class="form-group">
            <textarea
           type="text" class="form-control p-2" id="desc"  name="desc" required></textarea>
        </div>
        
    
        <div class="form-group">Phone Number
            <label for="pnumber" class="form-label"></label>
            <input type="number" class="form-control p-2" id="pnumber"  name="pass2" required>
          </div>
        <br/>
    
        <button type="submit" class="btn btn-primary">Contact</button>
        <br />
        Already User?  <a href="/auth/login/">Login</a>
        <br />
      </form>

    </div>
    <div class="col-md-4">3</div>



    
</div>  



{% endblock body %}
