{% extends "base.html" %} 
{% block title %}Checkout{% endblock title %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center">Checkout</h2>
    
    <!-- ✅ Cart Summary -->
    <div class="cart-summary">
        <h4>Your Cart</h4>
        <div id="cartItems" class="mb-4">
            <!-- Cart items will be dynamically inserted here -->
        </div>
        <div class="text-right">
            <h5>Total: <span id="totalPrice">₹ 0.00</span></h5>
        </div>
    </div>

    <!-- ✅ Shipping Information Form -->
    <div class="d-flex justify-content-center align-items-center vh-80">
        <div class="card bg-light w-50">
            <div>    
                <h3 class="text-dark">Shipping Information</h3>
            </div>

            <div class="shipping-info">
                <form id="shippingForm" method="POST" action="/checkout">
                    {% csrf_token %}
                    <input type="hidden" id="amount" name="amount">
                    <input type="hidden" name="order_id" id="order_id">
                    
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" class="form-control" name="name" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" name="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" class="form-control" name="phone" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" class="form-control" name="address" id="address" required>
                    </div>
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" class="form-control" name="city" id="city" required>
                    </div>
                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" class="form-control" name="state" id="state" required>
                    </div>
                    <div class="form-group">
                        <label for="zip">Zip Code</label>
                        <input type="text" class="form-control" name="zip" id="zip" required>
                    </div>
                    
                    <button type="button" class="btn btn-primary w-100" onclick="startPayment()">✅ Complete Purchase</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- ✅ Razorpay Payment Integration -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    let totalPrice = 0;

    // ✅ Load Cart Items from LocalStorage
    function loadCartItems() {
        var cart = localStorage.getItem('cart') ? JSON.parse(localStorage.getItem('cart')) : {};
        var cartItemsContainer = document.getElementById('cartItems');
        totalPrice = 0;

        for (var key in cart) {
            var item = cart[key];
            var itemHtml = `<div class="cart-item">
                <span>${item[1]} (x${item[0]}) - ₹${(item[0] * item[2]).toFixed(2)}</span>
            </div>`;
            cartItemsContainer.innerHTML += itemHtml;
            totalPrice += item[0] * item[2];
        }

        document.getElementById('totalPrice').innerText = `₹${totalPrice.toFixed(2)}`;
        localStorage.setItem('totalPrice', totalPrice); // Store total price in localStorage
    }

    window.onload = loadCartItems;

   

    // ✅ Start Payment After Button Click
    function startPayment() {
        // ✅ Capture Cart Total
        let totalAmount = localStorage.getItem('totalPrice');
        document.getElementById('amount').value = totalAmount * 100;
    
        // ✅ Send AJAX Request to Backend
        fetch('/checkout/', {
            method: 'POST',
            body: new FormData(document.getElementById('shippingForm'))
        })
        .then(response => response.json())
        .then(data => {
            // ✅ Open Razorpay Gateway
            var options = {
                "key": data.key,
                "amount": data.amount * 100,
                "currency": "INR",
                "order_id": data.order_id,
                "handler": function (response) {
                    alert("Payment Successful!");
                    window.location.href = "/payment-success/";
                }
            };
            var rzp = new Razorpay(options);
            rzp.open();
        });
    }
</script>

{% endblock content %}
